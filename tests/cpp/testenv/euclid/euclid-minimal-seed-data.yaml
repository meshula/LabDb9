# Euclid Nonostore Minimal Seed Data

# This file contains the minimal dataset for TDD validation of the Euclid ontology
# Purpose: Establish working triadic consciousness database with essential relationships
# Implementation: Load via S-expression commands or programmatic entity creation

## Core Text Fragment Entities

entities:
  # Foundational geometric definitions
  - id: "b1-def-1"
    content: "σημεῖόν ἐστιν, οὗ μέρος οὐθέν."
    metadata:
      book: "1"
      type: "definition"
      number: "1"
      xml_line: "134"
      english: "A point is that which has no part."
      
  - id: "b1-def-2"  
    content: "γραμμὴ δὲ μῆκος ἀπλατές."
    metadata:
      book: "1"
      type: "definition" 
      number: "2"
      xml_line: "135"
      english: "A line is breadthless length."

  # Golden ratio definition (key test case)
  - id: "b6-def-3"
    content: "ἄκρον καὶ μέσον λόγον εὐθεῖα τετμῆσθαι λέγεται, ὅταν ᾖ ὡς ἡ ὅλη πρὸς τὸ μεῖζον τμῆμα, οὕτως τὸ μεῖζον πρὸς τὸ ἔλαττον."
    metadata:
      book: "6"
      type: "definition"
      number: "3" 
      xml_line: "4690"
      english: "A straight line is said to have been cut in extreme and mean ratio when, as the whole line is to the greater segment, so is the greater to the less."

  # Pythagorean theorem (iconic proposition)
  - id: "b1-p47"
    content: "ἐν τοῖς ὀρθογωνίοις τριγώνοις τὸ ἀπὸ τῆς τὴν ὀρθὴν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον ἴσον ἐστὶ τοῖς ἀπὸ τῶν τὴν ὀρθὴν γωνίαν περιεχουσῶν πλευρῶν τετραγώνοις."
    metadata:
      book: "1"
      type: "proposition"
      number: "47"
      xml_line: "2847"
      english: "In right-angled triangles the square on the side subtending the right angle is equal to the squares on the sides containing the right angle."

  # Semantic concept entities
  - id: "concept-golden-ratio"
    content: "golden-ratio"
    metadata:
      type: "concept"
      domain: "proportion-theory"
      
  - id: "concept-proportion"
    content: "proportion" 
    metadata:
      type: "concept"
      domain: "mathematical-relationships"
      
  - id: "concept-triangle"
    content: "triangle"
    metadata:
      type: "concept" 
      domain: "geometric-figures"

  # Field classification entities
  - id: "field-definition"
    content: "definition"
    metadata:
      type: "field-type"
      logical_role: "foundational"
      
  - id: "field-proposition" 
    content: "proposition"
    metadata:
      type: "field-type"
      logical_role: "theorem"

  # Book organization entities  
  - id: "book-1"
    content: "book-1"
    metadata:
      type: "book"
      title: "Fundamentals of plane geometry"
      
  - id: "book-6"
    content: "book-6" 
    metadata:
      type: "book"
      title: "Plane geometry and proportion"

