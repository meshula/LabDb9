## TDD Test Cases

test_cases:
  - name: "Entity Storage with Unicode"
    description: "Store and retrieve Greek text without corruption"
    entity: "b6-def-3"
    expected_content: "ἄκρον καὶ μέσον λόγον εὐθεῖα τετμῆσθαι λέγεται..."
    
  - name: "Semantic Discovery"
    description: "Find related content via concept relationships"
    query: "relates-to golden-ratio"
    expected_entities: ["b6-def-3"]
    
  - name: "Triadic Navigation" 
    description: "Navigate via Motion/Memory/Field perspectives"
    motion_query: "concept golden-ratio" 
    memory_query: "predicate relates-to"
    field_query: "object book-6"
    
  - name: "Vocabulary Discovery"
    description: "Discover available relationship types"
    expected_predicates: 7
    expected_vocabulary_coherence: true

## Loading Instructions

To populate the test database:

1. **Initialize database**:
   ```bash
   db9 create-database test_euclid.db9
   db9 open-database test_euclid.db9
   ```

2. **Load entities** (run entity_commands sequentially)

3. **Load relationships** (run triple_commands sequentially)  

4. **Validate data** (run validation_commands)

5. **Run TDD tests** against expected results

