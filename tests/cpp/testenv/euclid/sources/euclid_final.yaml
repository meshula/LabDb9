    text: ἐὰν εὐθεῖα γραμμὴ ἄκρον καὶ μέσον λόγον τμηθῇ, τὸ μεῖζον τμῆμα προσλαβὸν
      τὴν ἡμίσειαν τῆς ὅλης πενταπλάσιον δύναται τοῦ ἀπὸ τῆς ἡμισείας τετραγώνου.
      εὐθεῖα γὰρ γραμμὴ ἡ ΑΒ ἄκρον καὶ μέσον λόγον τετμήσθω κατὰ τὸ Γ σημεῖον, καὶ
      ἔστω μεῖζον τμῆμα τὸ ΑΓ, καὶ ἐκβεβλήσθω ἐπ’ εὐθείας τῇ ΓΑ εὐθεῖα ἡ ΑΔ, καὶ κείσθω
      τῆς ΑΒ ἡμίσεια ἡ ΑΔ· λέγω, ὅτι πενταπλάσιόν ἐστι τὸ ἀπὸ τῆς ΓΔ τοῦ ἀπὸ τῆς ΔΑ.
      ἀναγεγράφθωσαν γὰρ ἀπὸ τῶν ΑΒ, ΔΓ τετράγωνα τὰ ΑΕ, ΔΖ, καὶ καταγεγράφθω ἐν τῷ
      ΔΖ τὸ σχῆμα, καὶ διήχθω ἡ ΖΓ ἐπὶ τὸ Η. καὶ ἐπεὶ ἡ ΑΒ ἄκρον καὶ μέσον λόγον τέτμηται
      κατὰ τὸ Γ, τὸ ἄρα ὑπὸ τῶν ΑΒΓ ἴσον ἐστὶ τῷ ἀπὸ τῆς ΑΓ. καί ἐστι τὸ μὲν ὑπὸ τῶν
      ΑΒΓ τὸ ΓΕ, τὸ δὲ ἀπὸ τῆς ΑΓ τὸ ΖΘ· ἴσον ἄρα τὸ ΓΕ τῷ ΖΘ. καὶ ἐπεὶ διπλῆ ἐστιν
      ἡ ΒΑ τῆς ΑΔ, ἴση δὲ ἡ μὲν ΒΑ τῇ ΚΑ, ἡ δὲ ΑΔ τῇ ΑΘ, διπλῆ ἄρα καὶ ἡ ΚΑ τῆς ΑΘ.
      ὡς δὲ ἡ ΚΑ πρὸς τὴν ΑΘ, οὕτως τὸ ΓΚ πρὸς τὸ ΓΘ· διπλάσιον ἄρα τὸ ΓΚ τοῦ ΓΘ.
      εἰσὶ δὲ καὶ τὰ ΛΘ, ΘΓ διπλάσια τοῦ ΓΘ. ἴσον ἄρα τὸ ΚΓ τοῖς ΛΘ, ΘΓ. ἐδείχθη δὲ
      καὶ τὸ ΓΕ τῷ ΘΖ ἴσον· ὅλον ἄρα τὸ ΑΕ τετράγωνον ἴσον ἐστὶ τῷ ΜΝΞ γνώμονι. καὶ
      ἐπεὶ διπλῆ ἐστιν ἡ ΒΑ τῆς ΑΔ, τετραπλάσιόν ἐστι τὸ ἀπὸ τῆς ΒΑ τοῦ ἀπὸ τῆς ΑΔ,
      τουτέστι τὸ ΑΕ τοῦ ΔΘ. ἴσον δὲ τὸ ΑΕ τῷ ΜΝΞ γνώμονι· καὶ ὁ ΜΝΞ ἄρα γνώμων τετραπλάσιός
      ἐστι τοῦ ΑΟ· ὅλον ἄρα τὸ ΔΖ πενταπλάσιόν ἐστι τοῦ ΑΟ. καί ἐστι τὸ μὲν ΔΖ τὸ
      ἀπὸ τῆς ΔΓ, τὸ δὲ ΑΟ τὸ ἀπὸ τῆς ΔΑ· τὸ ἄρα ἀπὸ τῆς ΓΔ πενταπλάσιόν ἐστι τοῦ
