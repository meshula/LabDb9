    text: τὰς πλευρὰς τῶν πέντε σχημάτων ἐκθέσθαι καὶ συγκρῖναι πρὸς ἀλλήλας. Ἐκκείσθω
      ἡ τῆς δοθείσης σφαίρας διάμετρος ἡ ΑΒ, καὶ τετμήσθω κατὰ τὸ Γ ὥστε ἴσην εἶναι
      τὴν ΑΓ τῇ ΓΒ, κατὰ δὲ τὸ Δ ὥστε διπλασίονα εἶναι τὴν ΑΔ τῆς ΔΒ, καὶ γεγράφθω
      ἐπὶ τῆς ΑΒ ἡμικύκλιον τὸ ΑΕΒ, καὶ ἀπὸ τῶν Γ, Δ τῇ ΑΒ πρὸς ὀρθὰς ἤχθωσαν αἱ ΓΕ,
      ΔΖ, καὶ ἐπεζεύχθωσαν αἱ ΑΖ, ΖΒ, ΕΒ. καὶ ἐπεὶ διπλῆ ἐστιν ἡ ΑΔ τῆς ΔΒ, τριπλῆ
      ἄρα ἐστὶν ἡ ΑΒ τῆς ΒΔ. ἀναστρέψαντι ἡμιολία ἄρα ἐστὶν ἡ ΒΑ τῆς ΑΔ. ὡς δὲ ἡ ΒΑ
      πρὸς τὴν ΑΔ, οὕτως τὸ ἀπὸ τῆς ΒΑ πρὸς τὸ ἀπὸ τῆς ΑΖ· ἰσογώνιον γάρ ἐστι τὸ ΑΖΒ
      τρίγωνον τῷ ΑΖΔ τριγώνῳ· ἡμιόλιον ἄρα ἐστὶ τὸ ἀπὸ τῆς ΒΑ τοῦ ἀπὸ τῆς ΑΖ. ἔστι
      δὲ καὶ ἡ τῆς σφαίρας διάμετρος δυνάμει ἡμιολία τῆς πλευρᾶς τῆς πυραμίδος. καί
      ἐστιν ἡ ΑΒ ἡ τῆς σφαίρας διάμετρος· ἡ ΑΖ ἄρα ἴση ἐστὶ τῇ πλευρᾷ τῆς πυραμίδος.
      πάλιν, ἐπεὶ διπλασίων ἐστὶν ἡ ΑΔ τῆς ΔΒ, τριπλῆ ἄρα ἐστὶν ἡ ΑΒ τῆς ΒΔ. ὡς δὲ
      ἡ ΑΒ πρὸς τὴν ΒΔ, οὕτως τὸ ἀπὸ τῆς ΑΒ πρὸς τὸ ἀπὸ τῆς ΒΖ· τριπλάσιον ἄρα ἐστὶ
      τὸ ἀπὸ τῆς ΑΒ τοῦ ἀπὸ τῆς ΒΖ. ἔστι δὲ καὶ ἡ τῆς σφαίρας διάμετρος δυνάμει τριπλασίων
      τῆς τοῦ κύβου πλευρᾶς. καί ἐστιν ἡ ΑΒ ἡ τῆς σφαίρας διάμετρος· ἡ ΒΖ ἄρα τοῦ
      κύβου ἐστὶ πλευρά. καὶ ἐπεὶ ἴση ἐστὶν ἡ ΑΓ τῇ ΓΒ, διπλῆ ἄρα ἐστὶν ἡ ΑΒ τῆς ΒΓ.
      ὡς δὲ ἡ ΑΒ πρὸς τὴν ΒΓ, οὕτως τὸ ἀπὸ τῆς ΑΒ πρὸς τὸ ἀπὸ τῆς ΒΕ· διπλάσιον ἄρα
      ἐστὶ τὸ ἀπὸ τῆς ΑΒ τοῦ ἀπὸ τῆς ΒΕ. ἔστι δὲ καὶ ἡ τῆς σφαίρας διάμετρος δυνάμει
      διπλασίων τῆς τοῦ ὀκταέδρου πλευρᾶς. καί ἐστιν ἡ ΑΒ ἡ τῆς δοθείσης σφαίρας διάμετρος·
      ἡ ΒΕ ἄρα τοῦ ὀκταέδρου ἐστὶ πλευρά. ἤχθω δὴ ἀπὸ τοῦ Α σημείου τῇ ΑΒ εὐθείᾳ πρὸς
      ὀρθὰς ἡ ΑΗ, καὶ κείσθω ἡ ΑΗ ἴση τῇ ΑΒ, καὶ ἐπεζεύχθω ἡ ΗΓ, καὶ ἀπὸ τοῦ Θ ἐπὶ
      τὴν ΑΒ κάθετος ἤχθω ἡ ΘΚ. καὶ ἐπεὶ διπλῆ ἐστιν ἡ ΗΑ τῆς ΑΓ· ἴση γὰρ ἡ ΗΑ τῇ
      ΑΒ· ὡς δὲ ἡ ΗΑ πρὸς τὴν ΑΓ, οὕτως ἡ ΘΚ πρὸς τὴν ΚΓ, διπλῆ ἄρα καὶ ἡ ΘΚ τῆς ΚΓ.
      τετραπλάσιον ἄρα ἐστὶ τὸ ἀπὸ τῆς ΘΚ τοῦ ἀπὸ τῆς ΚΓ· τὰ ἄρα ἀπὸ τῶν ΘΚ, ΚΓ, ὅπερ
      ἐστὶ τὸ ἀπὸ τῆς ΘΓ, πενταπλάσιόν ἐστι τοῦ ἀπὸ τῆς ΚΓ. ἴση δὲ ἡ ΘΓ τῇ ΓΒ· πενταπλάσιον
      ἄρα ἐστὶ τὸ ἀπὸ τῆς ΒΓ τοῦ ἀπὸ τῆς ΓΚ. καὶ ἐπεὶ διπλῆ ἐστιν ἡ ΑΒ τῆς ΓΒ, ὧν
      ἡ ΑΔ τῆς ΔΒ ἐστι διπλῆ, λοιπὴ ἄρα ἡ ΒΔ λοιπῆς τῆς ΔΓ ἐστι διπλῆ. τριπλῆ ἄρα
      ἡ ΒΓ τῆς ΓΔ· ἐνναπλάσιον ἄρα τὸ ἀπὸ τῆς ΒΓ τοῦ ἀπὸ τῆς ΓΔ. πενταπλάσιον δὲ τὸ
      ἀπὸ τῆς ΒΓ τοῦ ἀπὸ τῆς ΓΚ· μεῖζον ἄρα τὸ ἀπὸ τῆς ΓΚ τοῦ ἀπὸ τῆς ΓΔ. μείζων ἄρα
      ἐστὶν ἡ ΓΚ τῆς ΓΔ. κείσθω τῇ ΓΚ ἴση ἡ ΓΛ, καὶ ἀπὸ τοῦ Λ τῇ ΑΒ πρὸς ὀρθὰς ἤχθω
      ἡ ΛΜ, καὶ ἐπεζεύχθω ἡ ΜΒ. καὶ ἐπεὶ πενταπλάσιόν ἐστι τὸ ἀπὸ τῆς ΒΓ τοῦ ἀπὸ τῆς
      ΓΚ, καί ἐστι τῆς μὲν ΒΓ διπλῆ ἡ ΑΒ, τῆς δὲ ΓΚ διπλῆ ἡ ΚΛ, πενταπλάσιον ἄρα ἐστὶ
      τὸ ἀπὸ τῆς ΑΒ τοῦ ἀπὸ τῆς ΚΛ. ἔστι δὲ καὶ ἡ τῆς σφαίρας διάμετρος δυνάμει πενταπλασίων
      τῆς ἐκ τοῦ κέντρου τοῦ κύκλου, ἀφ’ οὗ τὸ εἰκοσάεδρον ἀναγέγραπται. καί ἐστιν
      ἡ ΑΒ ἡ τῆς σφαίρας διάμετρος· ἡ ΚΛ ἄρα ἐκ τοῦ κέντρου ἐστὶ τοῦ κύκλου, ἀφ’ οὗ
      τὸ εἰκοσάεδρον ἀναγέγραπται· ἡ ΚΛ ἄρα ἑξαγώνου ἐστὶ πλευρὰ τοῦ εἰρημένου κύκλου.
      καὶ ἐπεὶ ἡ τῆς σφαίρας διάμετρος σύγκειται ἔκ τε τῆς τοῦ ἑξαγώνου καὶ δύο τῶν
      τοῦ δεκαγώνου τῶν εἰς τὸν εἰρημένον κύκλον ἐγγραφομένων, καί ἐστιν ἡ μὲν ΑΒ
      ἡ τῆς σφαίρας διάμετρος, ἡ δὲ ΚΛ ἑξαγώνου πλευρά, καὶ ἴση ἡ ΑΚ τῇ ΛΒ, ἑκατέρα
      ἄρα τῶν ΑΚ, ΛΒ δεκαγώνου ἐστὶ πλευρὰ τοῦ ἐγγραφομένου εἰς τὸν κύκλον, ἀφ’ οὗ
      τὸ εἰκοσάεδρον ἀναγέγραπται. καὶ ἐπεὶ δεκαγώνου μὲν ἡ ΛΒ, ἑξαγώνου δὲ ἡ ΜΛ·
      ἴση γάρ ἐστι τῇ ΚΛ, ἐπεὶ καὶ τῇ ΘΚ· ἴσον γὰρ ἀπέχουσιν ἀπὸ τοῦ κέντρου· καί
      ἐστιν ἑκατέρα τῶν ΘΚ, ΚΛ διπλασίων τῆς ΚΓ· πενταγώνου ἄρα ἐστὶν ἡ ΜΒ. ἡ δὲ τοῦ
      πενταγώνου ἐστὶν ἡ τοῦ εἰκοσαέδρου· εἰκοσαέδρου ἄρα ἐστὶν ἡ ΜΒ. καὶ ἐπεὶ ἡ ΖΒ
      κύβου ἐστὶ πλευρά, τετμήσθω ἄκρον καὶ μέσον λόγον κατὰ τὸ Ν, καὶ ἔστω μεῖζον
      τμῆμα τὸ ΝΒ· ἡ ΝΒ ἄρα δωδεκαέδρου ἐστὶ πλευρά. καὶ ἐπεὶ ἡ τῆς σφαίρας διάμετρος
      ἐδείχθη τῆς μὲν ΑΖ πλευρᾶς τῆς πυραμίδος δυνάμει ἡμιολία, τῆς δὲ τοῦ ὀκταέδρου
      τῆς ΒΕ δυνάμει διπλασίων, τῆς δὲ τοῦ κύβου τῆς ΖΒ δυνάμει τριπλασίων, οἵων ἄρα
      ἡ τῆς σφαίρας διάμετρος δυνάμει ἕξ, τοιούτων ἡ μὲν τῆς πυραμίδος τεσσάρων, ἡ
      δὲ τοῦ ὀκταέδρου τριῶν, ἡ δὲ τοῦ κύβου δύο. ἡ μὲν ἄρα τῆς πυραμίδος πλευρὰ τῆς
      μὲν τοῦ ὀκταέδρου πλευρᾶς δυνάμει ἐστὶν ἐπίτριτος, τῆς δὲ τοῦ κύβου δυνάμει
      διπλῆ, ἡ δὲ τοῦ ὀκταέδρου τῆς τοῦ κύβου δυνάμει ἡμιολία. αἱ μὲν οὖν εἰρημέναι
      τῶν τριῶν σχημάτων πλευραί, λέγω δὴ πυραμίδος καὶ ὀκταέδρου καὶ κύβου, πρὸς
      ἀλλήλας εἰσὶν ἐν λόγοις ῥητοῖς. αἱ δὲ λοιπαὶ δύο, λέγω δὴ ἥ τε τοῦ εἰκοσαέδρου
      καὶ ἡ τοῦ δωδεκαέδρου, οὔτε πρὸς ἀλλήλας οὔτε πρὸς τὰς προειρημένας εἰσὶν ἐν
      λόγοις ῥητοῖς· ἄλογοι γάρ εἰσιν, ἡ μὲν ἐλάττων, ἡ δὲ ἀποτομή. ὅτι μείζων ἐστὶν
      ἡ τοῦ εἰκοσαέδρου πλευρὰ ἡ ΜΒ τῆς τοῦ δωδεκαέδρου τῆς ΝΒ, δείξομεν οὕτως. ἐπεὶ
      γὰρ ἰσογώνιόν ἐστι τὸ ΖΔΒ τρίγωνον τῷ ΖΑΒ τριγώνῳ, ἀνάλογόν ἐστιν ὡς ἡ ΔΒ πρὸς
      τὴν ΒΖ, οὕτως ἡ ΒΖ πρὸς τὴν ΒΑ. καὶ ἐπεὶ τρεῖς εὐθεῖαι ἀνάλογόν εἰσιν, ἔστιν
      ὡς ἡ πρώτη πρὸς τὴν τρίτην, οὕτως τὸ ἀπὸ τῆς πρώτης πρὸς τὸ ἀπὸ τῆς δευτέρας·
      ἔστιν ἄρα ὡς ἡ ΔΒ πρὸς τὴν ΒΑ, οὕτως τὸ ἀπὸ τῆς ΔΒ πρὸς τὸ ἀπὸ τῆς ΒΖ· ἀνάπαλιν
      ἄρα ὡς ἡ ΑΒ πρὸς τὴν ΒΔ, οὕτως τὸ ἀπὸ τῆς ΖΒ πρὸς τὸ ἀπὸ τῆς ΒΔ. τριπλῆ δὲ ἡ
      ΑΒ τῆς ΒΔ· τριπλάσιον ἄρα τὸ ἀπὸ τῆς ΖΒ τοῦ ἀπὸ τῆς ΒΔ. ἔστι δὲ καὶ τὸ ἀπὸ τῆς
      ΑΔ τοῦ ἀπὸ τῆς ΔΒ τετραπλάσιον· διπλῆ γὰρ ἡ ΑΔ τῆς ΔΒ· μεῖζον ἄρα τὸ ἀπὸ τῆς
      ΑΔ τοῦ ἀπὸ τῆς ΖΒ· μείζων ἄρα ἡ ΑΔ τῆς ΖΒ· πολλῷ ἄρα ἡ ΑΛ τῆς ΖΒ μείζων ἐστίν.
      καὶ τῆς μὲν ΑΛ ἄκρον καὶ μέσον λόγον τεμνομένης τὸ μεῖζον τμῆμά ἐστιν ἡ ΚΛ,
      ἐπειδήπερ ἡ μὲν ΛΚ ἑξαγώνου ἐστίν, ἡ δὲ ΚΑ δεκαγώνου· τῆς δὲ ΖΒ ἄκρον καὶ μέσον
      λόγον τεμνομένης τὸ μεῖζον τμῆμά ἐστιν ἡ ΝΒ· μείζων ἄρα ἡ ΚΛ τῆς ΝΒ. ἴση δὲ
      ἡ ΚΛ τῇ ΛΜ· μείζων ἄρα ἡ ΛΜ τῆς ΝΒ τῆς δὲ ΛΜ μείζων ἐστὶν ἡ ΜΒ. πολλῷ ἄρα ἡ
      ΜΒ πλευρὰ οὖσα τοῦ εἰκοσαέδρου μείζων ἐστὶ τῆς ΝΒ πλευρᾶς οὔσης τοῦ δωδεκαέδρου·
      ὅπερ ἔδει δεῖξαι. λέγω δή, ὅτι παρὰ τὰ εἰρημένα πέντε σχήματα οὐ συσταθήσεται
      ἕτερον σχῆμα περιεχόμενον ὑπὸ ἰσοπλεύρων τε καὶ ἰσογωνίων ἴσων ἀλλήλοις. ὑπὸ
      μὲν γὰρ δύο τριγώνων ἢ ὅλως ἐπιπέδων στερεὰ γωνία οὐ συνίσταται. ὑπὸ δὲ τριῶν
      τριγώνων ἡ τῆς πυραμίδος, ὑπὸ δὲ τεσσάρων ἡ τοῦ ὀκταέδρου, ὑπὸ δὲ πέντε ἡ τοῦ
      εἰκοσαέδρου· ὑπὸ δὲ ἓξ τριγώνων ἰσοπλεύρων τε καὶ ἰσογωνίων πρὸς ἑνὶ σημείῳ
      συνισταμένων οὐκ ἔσται στερεὰ γωνία· οὔσης γὰρ τῆς τοῦ ἰσοπλεύρου τριγώνου γωνίας
      διμοίρου ὀρθῆς ἔσονται αἱ ἓξ τέσσαρσιν ὀρθαῖς ἴσαι· ὅπερ ἀδύνατον· ἅπασα γὰρ
      στερεὰ γωνία ὑπὸ ἐλασσόνων ἢ τεσσάρων ὀρθῶν περιέχεται. διὰ τὰ αὐτὰ δὴ οὐδὲ
      ὑπὸ πλειόνων ἢ ἓξ γωνιῶν ἐπιπέδων στερεὰ γωνία συνίσταται. ὑπὸ δὲ τετραγώνων
      τριῶν ἡ τοῦ κύβου γωνία περιέχεται· ὑπὸ δὲ τεσσάρων ἀδύνατον· ἔσονται γὰρ πάλιν
      τέσσαρες ὀρθαί. ὑπὸ δὲ πενταγώνων ἰσοπλεύρων καὶ ἰσογωνίων, ὑπὸ μὲν τριῶν ἡ
      τοῦ δωδεκαέδρου· ὑπὸ δὲ τεσσάρων ἀδύνατον· οὔσης γὰρ τῆς τοῦ πενταγώνου ἰσοπλεύρου
      γωνίας ὀρθῆς καὶ πέμπτου, ἔσονται αἱ τέσσαρες γωνίαι τεσσάρων ὀρθῶν μείζους·
      ὅπερ ἀδύνατον. οὐδὲ μὴν ὑπὸ πολυγώνων ἑτέρων σχημάτων περισχεθήσεται στερεὰ
      γωνία διὰ τὸ αὐτὸ ἄτοπον. οὐκ ἄρα παρὰ τὰ εἰρημένα πέντε σχήματα ἕτερον σχῆμα
      στερεὸν συσταθήσεται ὑπὸ ἰσοπλεύρων τε καὶ ἰσογωνίων περιεχόμενον· ὅπερ ἔδει
      δεῖξαι. λῆμμα ὅτι δὲ ἡ τοῦ ἰσοπλεύρου καὶ ἰσογωνίου πενταγώνου γωνία ὀρθή ἐστι
      καὶ πέμπτου, οὕτω δεικτέον. ἔστω γὰρ πεντάγωνον ἰσόπλευρον καὶ ἰσογώνιον τὸ
      ΑΒΓΔΕ, καὶ περιγεγράφθω περὶ αὐτὸ κύκλος ὁ ΑΒΓ ΔΕ, καὶ εἰλήφθω αὐτοῦ τὸ κέντρον
      τὸ Ζ, καὶ ἐπεζεύχθωσαν αἱ ΖΑ, ΖΒ, ΖΓ, ΖΔ, ΖΕ. δίχα ἄρα τέμνουσι τὰς πρὸς τοῖς
      Α, Β, Γ, Δ, Ε τοῦ πενταγώνου γωνίας. καὶ ἐπεὶ αἱ πρὸς τῷ Ζ πέντε γωνίαι τέσσαρσιν
      ὀρθαῖς ἴσαι εἰσὶ καί εἰσιν ἴσαι, μία ἄρα αὐτῶν, ὡς ἡ ὑπὸ ΑΖΒ, μιᾶς ὀρθῆς ἐστι
      παρὰ πέμπτον· λοιπαὶ ἄρα αἱ ὑπὸ ΖΑΒ, ΑΒΖ μιᾶς εἰσιν ὀρθῆς καὶ πέμπτου. ἴση δὲ
      ἡ ὑπὸ ΖΑΒ τῇ ὑπὸ ΖΒΓ· καὶ ὅλη ἄρα ἡ ὑπὸ ΑΒΓ τοῦ πενταγώνου γωνία μιᾶς ἐστιν
      ὀρθῆς καὶ πέμπτου· ὅπερ ἔδει δεῖξαι.
