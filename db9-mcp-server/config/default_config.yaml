# Default configuration for DB9 MCP Server
# Single database configuration for Phase 1

database:
  # Path to LabDb database file
  path: "../triadic.db9"
  
  # Domain classification for this database
  domain_type: "mixed"
  
  # Display name for user interfaces
  display_name: "LabDb Triadic Consciousness Database"
  
  # Connection settings
  connection:
    timeout_seconds: 30
    retry_attempts: 3
    pool_size: 1  # Single connection for Phase 1

# Server configuration
server:
  name: "DB9 Triadic Consciousness Gateway"
  version: "0.1.0"
  description: "Natural language interface to triadic consciousness databases"
  
  # Logging configuration
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Query processing settings
  query:
    max_depth: 5          # Maximum triadic navigation depth
    default_depth: 2      # Default exploration depth
    timeout_seconds: 60   # Query timeout
    
# Phase 1 feature flags
features:
  natural_language_processing: false  # Basic keyword parsing only
  llm_integration: false              # No LLM sampling in Phase 1
  federation: false                   # Single database only
  user_elicitation: false            # No interactive refinement yet
  
# Development settings
development:
  debug_mode: true
  reload_on_change: true
  test_database_path: "../test_data/test_triadic.db9"
